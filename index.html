<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>線上劃位</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>線上劃位</h1>
  </header>

  <main class="container">
    <div id="notice" class="notice hidden"></div>

    <!-- 1. 查詢學生 -->
    <section id="view-login" class="hidden">
      <h2 class="section-title">查詢學生</h2>
      <form id="login-form" class="panel">
        <label>學生姓名
          <input id="l-name" type="text" maxlength="20" required autocomplete="off" placeholder="例：王小明">
        </label>
        <label>家長手機（報名時留的號碼）
          <input id="l-phone" type="tel" inputmode="numeric" maxlength="12" required placeholder="0912345678">
        </label>
        <button type="submit" id="l-submit" class="btn primary block">查詢我的班級</button>
      </form>
      <div id="saved-students" class="saved hidden"></div>
    </section>

    <!-- 2. 學生的班級 -->
    <section id="view-classes" class="hidden">
      <div class="toolbar">
        <h2 class="section-title"><span id="c-student"></span> 的班級</h2>
        <button type="button" id="btn-switch" class="btn small">切換學生</button>
      </div>
      <div id="class-list" class="card-list"></div>
    </section>

    <!-- 3. 座位圖 -->
    <section id="view-seats" class="hidden">
      <button type="button" id="btn-back" class="btn-link">← 回班級列表</button>
      <div class="session-head">
        <h2 id="s-title"></h2>
        <p id="s-meta" class="muted"></p>
        <p id="s-note" class="note"></p>
      </div>

      <div id="my-booking" class="my-booking"></div>

      <div class="legend">
        <span><i class="seat available"></i>可劃位</span>
        <span><i class="seat taken"></i>已有人</span>
        <span><i class="seat mine"></i>我的座位</span>
      </div>

      <div id="seat-map" class="seat-map-wrap"></div>
      <p class="muted small center">座位圖可左右滑動。點空位即可劃位；已經有座位的話，點其他空位可以換位。</p>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
