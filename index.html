<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>線上劃位</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>線上劃位</h1>
  </header>

  <main class="container">
    <div id="notice" class="notice hidden"></div>

    <!-- 場次列表 -->
    <section id="view-sessions">
      <h2 class="section-title">選擇場次</h2>
      <div id="session-list" class="card-list">
        <p class="muted">載入中…</p>
      </div>
    </section>

    <!-- 座位圖 -->
    <section id="view-seats" class="hidden">
      <button type="button" id="btn-back" class="btn-link">← 回場次列表</button>
      <div class="session-head">
        <h2 id="s-title"></h2>
        <p id="s-meta" class="muted"></p>
        <p id="s-note" class="note"></p>
      </div>

      <div id="my-booking" class="my-booking hidden"></div>

      <div class="legend">
        <span><i class="seat available"></i>可劃位</span>
        <span><i class="seat taken"></i>已劃走</span>
        <span><i class="seat mine"></i>我的位子</span>
      </div>

      <div id="seat-map" class="seat-map-wrap"></div>
      <p class="muted small center">座位圖可左右滑動。點選空位即可劃位。</p>
    </section>
  </main>

  <!-- 劃位表單 -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <form id="booking-form" class="modal-box">
      <h3>確認劃位：<span id="m-seat" class="seat-tag"></span></h3>
      <p id="m-session" class="muted small"></p>
      <label>學生姓名
        <input id="f-name" type="text" maxlength="20" required autocomplete="name">
      </label>
      <label>聯絡手機
        <input id="f-phone" type="tel" inputmode="numeric" maxlength="12" placeholder="0912345678" required>
      </label>
      <p class="muted small">同一支手機每個場次只能劃一個位子。劃位紀錄會存在這台裝置的瀏覽器，若之後換手機或清除瀏覽資料，請聯絡櫃台協助更改。</p>
      <div class="modal-actions">
        <button type="button" id="m-cancel" class="btn">取消</button>
        <button type="submit" id="m-submit" class="btn primary">確認劃位</button>
      </div>
    </form>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
