<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>劃位後台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin">
  <header class="topbar">
    <h1>劃位後台</h1>
    <div id="user-box" class="user-box hidden">
      <span id="user-email" class="small"></span>
      <button type="button" id="btn-logout" class="btn small">登出</button>
    </div>
  </header>

  <main class="container wide">
    <div id="notice" class="notice hidden"></div>

    <!-- 登入 -->
    <section id="view-login" class="hidden center">
      <p>請使用管理員的 Google 帳號登入。</p>
      <button type="button" id="btn-login" class="btn primary">使用 Google 登入</button>
    </section>

    <!-- 無權限 -->
    <section id="view-denied" class="hidden center">
      <p>這個帳號（<span id="denied-email"></span>）沒有後台權限。</p>
      <button type="button" id="btn-logout2" class="btn">換一個帳號</button>
    </section>

    <!-- 場次列表 -->
    <section id="view-list" class="hidden">
      <div class="toolbar">
        <h2 class="section-title">場次管理</h2>
        <button type="button" id="btn-new" class="btn primary">＋ 新增場次</button>
      </div>
      <div id="admin-session-list" class="card-list"></div>
    </section>

    <!-- 新增 / 編輯場次 -->
    <section id="view-editor" class="hidden">
      <button type="button" class="btn-link js-back">← 回場次列表</button>
      <h2 id="editor-title" class="section-title">新增場次</h2>
      <form id="editor-form" class="editor">
        <div class="form-grid">
          <label class="span2">場次名稱 *
            <input id="e-title" type="text" required maxlength="60" placeholder="例：高一數學 12/5 模考">
          </label>
          <label>分校
            <select id="e-branch"></select>
          </label>
          <label>教室
            <input id="e-room" type="text" maxlength="30" placeholder="例：301 教室">
          </label>
          <label>日期 *
            <input id="e-date" type="date" required>
          </label>
          <label>時間
            <input id="e-time" type="text" maxlength="30" placeholder="例：19:00-21:00">
          </label>
          <label class="span2">備註（會顯示在前台）
            <textarea id="e-note" rows="2" maxlength="300" placeholder="例：請提早 10 分鐘入場"></textarea>
          </label>
        </div>

        <h3>座位配置</h3>
        <div class="form-grid">
          <label>排數（A、B、C…，最多 26）
            <input id="e-rows" type="number" min="1" max="26" value="6" required>
          </label>
          <label>每排座位數（最多 30）
            <input id="e-cols" type="number" min="1" max="30" value="8" required>
          </label>
          <label class="span2">走道位置：在第幾號座位右邊留走道（用逗號分隔）
            <input id="e-aisles" type="text" placeholder="例：2, 6">
          </label>
        </div>
        <p class="muted small">在下方預覽圖點一下座位可以切換「不設座位」（灰色虛線），例如柱子、講桌旁的位置。</p>
        <div id="editor-preview" class="seat-map-wrap"></div>
        <p id="editor-count" class="muted small center"></p>

        <label class="check"><input id="e-open" type="checkbox"> 儲存後立即開放劃位</label>

        <div class="form-actions">
          <button type="button" class="btn js-back">取消</button>
          <button type="submit" id="e-submit" class="btn primary">儲存場次</button>
        </div>
      </form>
    </section>

    <!-- 場次名單 -->
    <section id="view-detail" class="hidden">
      <button type="button" class="btn-link js-back">← 回場次列表</button>
      <div class="session-head">
        <h2 id="d-title"></h2>
        <p id="d-meta" class="muted"></p>
      </div>
      <div class="toolbar">
        <div id="d-stat"></div>
        <div class="btn-group">
          <button type="button" id="d-toggle" class="btn"></button>
          <button type="button" id="d-copy" class="btn">複製劃位連結</button>
          <button type="button" id="d-export" class="btn">匯出 CSV</button>
        </div>
      </div>
      <div id="d-map" class="seat-map-wrap admin-map"></div>
      <p class="muted small center">滑鼠移到座位上可看姓名與電話；點已劃位的座位可以取消該筆劃位。</p>
      <table class="table">
        <thead><tr><th>座位</th><th>姓名</th><th>手機</th><th>劃位時間</th><th></th></tr></thead>
        <tbody id="d-rows"></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
